spring.application.name=hotel-booking-backend

# Optionally load a local backend/.env file (copy .env.example to .env).
# Real environment variables always win over the file.
spring.config.import=optional:file:.env[.properties]

# ---------- Server ----------
server.port=${PORT:8080}

# ---------- Database (values come from environment variables) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:hotel_user}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA ----------
# "validate" checks that the tables match the entities; the schema itself is
# created by the SQL scripts (added in Phase 2).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- JWT (used from Phase 3) ----------
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS: comma-separated list of allowed frontend origins ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
